services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: claro-backend
    ports:
      - "8010:8010"
    volumes:
      - ${MODELS_PATH:-/Users/kuka/CIVILCOMPLAINT/models}:/root/CIVILCOMPLAINT/models:ro
      - ${DATA_PATH:-/Users/kuka/CIVILCOMPLAINT/data}:/root/CIVILCOMPLAINT/data:ro
      - ${RESULTS_PATH:-/Users/kuka/CIVILCOMPLAINT/results}:/root/CIVILCOMPLAINT/results:ro
      - ./backend/data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - DEVICE=${DEVICE:-cpu}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:8010
    container_name: claro-frontend
    ports:
      - "3010:3010"
    environment:
      - BACKEND_URL=http://backend:8010
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: claro-network
