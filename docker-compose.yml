services:
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: claro-ml-service
    ports:
      - "8001:8001"
    volumes:
      - /Users/kuka/CIVILCOMPLAINT/models:/root/CIVILCOMPLAINT/models:ro
      - /Users/kuka/CIVILCOMPLAINT/data:/root/CIVILCOMPLAINT/data:ro
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  llm-service:
    build:
      context: ./llm-service
      dockerfile: Dockerfile
    container_name: claro-llm-service
    ports:
      - "8002:8002"
    volumes:
      - /Users/kuka/CIVILCOMPLAINT/models:/root/CIVILCOMPLAINT/models:ro
      - /Users/kuka/CIVILCOMPLAINT/data:/root/CIVILCOMPLAINT/data:ro
    environment:
      - PYTHONUNBUFFERED=1
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: claro-frontend
    ports:
      - "3000:3000"
    depends_on:
      - ml-service
      - llm-service
    restart: unless-stopped

networks:
  default:
    name: claro-network
