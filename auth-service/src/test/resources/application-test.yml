server:
  port: 8003

spring:
  application:
    name: auth-service-test

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: aether-jwt-test-secret-key-64-bytes-minimum-for-hmac-sha512-test
  access-expiration: 1800000
  refresh-expiration: 604800000

logging:
  level:
    com.aether: DEBUG
