server:
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    gateway:
      routes:
        - id: ml-service
          uri: http://ml-service:8000
          predicates:
            - Path=/api/ml/**
          filters:
            - StripPrefix=2

        - id: llm-service
          uri: http://llm-service:8000
          predicates:
            - Path=/api/llm/**
          filters:
            - StripPrefix=2

  data:
    redis:
      host: redis
      port: 6379

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, profile, email

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
